<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials & Notes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- TOP APP HEADER -->
    <div class="bg-gradient-to-r from-purple-800 via-purple-700 to-indigo-900 text-white px-4 pt-5 pb-8 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-wide">Study Materials</h1>
                    <p class="text-xs text-purple-200">PDF Notes, Books & Handouts</p>
                </div>
            </div>
            <div class="w-9 h-9 rounded-full bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-300">
                <i class="fa-solid fa-folder-open"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-md mx-auto px-4 -mt-4 space-y-4">

        <!-- SEARCH BAR -->
        <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-gray-400 ml-2"></i>
            <input type="text" id="notesSearch" onkeyup="filterNotes()" placeholder="Search topic or subject..." class="w-full text-xs bg-transparent focus:outline-none text-gray-800">
        </div>

        <!-- SUBJECT CHIPS -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-semibold">
            <button onclick="filterSubject('All')" class="sub-btn active bg-purple-700 text-white px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap">
                All Subjects
            </button>
            <button onclick="filterSubject('Zoology')" class="sub-btn bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap">
                Zoology
            </button>
            <button onclick="filterSubject('Botany')" class="sub-btn bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap">
                Botany
            </button>
            <button onclick="filterSubject('Physics')" class="sub-btn bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap">
                Physics
            </button>
            <button onclick="filterSubject('Chemistry')" class="sub-btn bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap">
                Chemistry
            </button>
        </div>

        <!-- NOTES LIST CONTAINER -->
        <div id="notesContainer" class="space-y-3">
            <!-- Dynamic Notes Rendered Here -->
        </div>

    </div>

    <script>
        const materials = [
            {
                id: 1,
                title: "Human Reproduction - Handwritten Notes",
                subject: "Zoology",
                class: "Class 12th",
                size: "4.2 MB",
                date: "04 Sep 2026",
                fileUrl: "#"
            },
            {
                id: 2,
                title: "Cell Cycle & Division Question Bank",
                subject: "Botany",
                class: "Class 11th",
                size: "2.8 MB",
                date: "01 Sep 2026",
                fileUrl: "#"
            },
            {
                id: 3,
                title: "Electrostatics Formula Sheet & Short Notes",
                subject: "Physics",
                class: "Class 12th",
                size: "1.5 MB",
                date: "28 Aug 2026",
                fileUrl: "#"
            },
            {
                id: 4,
                title: "Organic Chemistry Reaction Mechanism",
                subject: "Chemistry",
                class: "Class 12th",
                size: "3.1 MB",
                date: "20 Aug 2026",
                fileUrl: "#"
            }
        ];

        let currentSub = 'All';

        function renderNotes() {
            const container = document.getElementById("notesContainer");
            const searchTxt = document.getElementById("notesSearch").value.toLowerCase();

            const filtered = materials.filter(m => {
                const matchesSearch = m.title.toLowerCase().includes(searchTxt) || m.subject.toLowerCase().includes(searchTxt);
                const matchesSub = currentSub === 'All' || m.subject === currentSub;
                return matchesSearch && matchesSub;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-file-pdf text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-600 font-bold text-sm">No Study Material Found!</p>
                        <p class="text-gray-400 text-xs mt-1">Try searching with a different keyword.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-red-50 border border-red-100 text-red-600 flex items-center justify-center text-xl flex-shrink-0">
                            <i class="fa-solid fa-file-pdf"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-gray-800 leading-snug line-clamp-1">${item.title}</h3>
                            <div class="flex items-center gap-2 mt-1 text-[10px] text-gray-400 font-medium">
                                <span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-md font-bold">${item.subject}</span>
                                <span>• ${item.class}</span>
                                <span>• ${item.size}</span>
                            </div>
                        </div>
                    </div>
                    <a href="${item.fileUrl}" target="_blank" class="w-9 h-9 rounded-xl bg-purple-700 hover:bg-purple-800 text-white flex items-center justify-center text-xs flex-shrink-0 shadow transition">
                        <i class="fa-solid fa-download"></i>
                    </a>
                </div>
            `).join('');
        }

        function filterSubject(sub) {
            currentSub = sub;
            document.querySelectorAll('.sub-btn').forEach(btn => {
                if (btn.innerText.toLowerCase().includes(sub.toLowerCase()) || (sub === 'All' && btn.innerText.includes('All'))) {
                    btn.className = "sub-btn active bg-purple-700 text-white px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap";
                } else {
                    btn.className = "sub-btn bg-white border border-gray-200 text-gray-600 px-3.5 py-1.5 rounded-xl shadow-sm whitespace-nowrap";
                }
            });
            renderNotes();
        }

        function filterNotes() {
            renderNotes();
        }

        renderNotes();
    </script>
</body>
</html>
