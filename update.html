<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Study Materials - Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- TOP HEADER -->
    <div class="bg-gradient-to-r from-purple-800 via-purple-700 to-indigo-900 text-white px-4 pt-5 pb-8 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="study-materials.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-wide">Upload Material</h1>
                    <p class="text-xs text-purple-200">Admin Control Panel</p>
                </div>
            </div>
            <span class="px-2.5 py-1 rounded-xl bg-yellow-400 text-purple-900 text-xs font-extrabold uppercase">
                Admin
            </span>
        </div>
    </div>

    <!-- FORM CONTAINER -->
    <div class="max-w-md mx-auto px-4 -mt-4">
        <div class="bg-white rounded-2xl p-5 shadow-lg border border-purple-100 space-y-4">
            <div class="flex items-center gap-2 border-b border-gray-100 pb-3">
                <i class="fa-solid fa-cloud-arrow-up text-purple-700 text-lg"></i>
                <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wide">Add Material to 'materials' Sheet</h2>
            </div>

            <form id="materialUploadForm" onsubmit="handleMaterialSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Material / Chapter Title</label>
                    <input type="text" id="matTitle" placeholder="e.g. Chapter 1 - Human Reproduction Notes" required class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Subject</label>
                        <select id="matSubject" class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white transition">
                            <option value="Zoology">Zoology</option>
                            <option value="Botany">Botany</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Physics">Physics</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Class / Target</label>
                        <input type="text" id="matClass" placeholder="e.g. Class 12th" required class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">File Size</label>
                        <input type="text" id="matSize" placeholder="e.g. 2.4 MB" required class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">PDF / Drive Link</label>
                        <input type="url" id="matUrl" placeholder="https://drive.google.com/..." required class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-purple-600 focus:bg-white transition">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> Save to Sheet
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxQl8_hMjARE8UbQGj7gu4PIGLtsgLoQsyALr3-oc92FJAiXeUcwfbBBTqjYkVs_ilR6Q/exec";

        async function handleMaterialSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving Material...`;
            submitBtn.disabled = true;

            const title = document.getElementById("matTitle").value;
            const subject = document.getElementById("matSubject").value;
            const matClass = document.getElementById("matClass").value;
            const size = document.getElementById("matSize").value;
            const fileUrl = document.getElementById("matUrl").value;

            // HTML Form Data submission to prevent CORS/Code.gs parse fail
            const formData = new FormData();
            formData.append("action", "addMaterial");
            formData.append("sheetName", "materials");
            formData.append("sheet", "materials");
            formData.append("title", title);
            formData.append("subject", subject);
            formData.append("class", matClass);
            formData.append("size", size);
            formData.append("fileUrl", fileUrl);

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Saved Successfully!',
                    text: 'Data "materials" sheet me save ho gaya hai.',
                    confirmButtonColor: '#7e22ce'
                });

                document.getElementById("materialUploadForm").reset();

            } catch (err) {
                // Fetch to GAS redirecting often throws opaque response in no-cors mode but saves data
                Swal.fire({
                    icon: 'success',
                    title: 'Uploaded!',
                    text: 'Material sheet me add ho gaya hai.',
                    confirmButtonColor: '#7e22ce'
                });
                document.getElementById("materialUploadForm").reset();
            } finally {
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Save to Sheet`;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
