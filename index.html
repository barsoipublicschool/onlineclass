<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassWalla - Educator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen pb-10">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg text-xl font-bold">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <span class="text-xl font-bold tracking-wide">ClassWalla Portal</span>
        </div>
        <div class="text-sm bg-gray-700 px-3 py-1.5 rounded-full text-gray-300">
            <i class="fa-solid fa-circle text-green-500 text-xs mr-1"></i> Live Database
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">Total Students</p>
                    <h3 id="statStudents" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <i class="fa-solid fa-users text-blue-500 text-3xl"></i>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">Total Courses</p>
                    <h3 id="statCourses" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <i class="fa-solid fa-book-open text-purple-500 text-3xl"></i>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">Active Live Classes</p>
                    <h3 id="statLive" class="text-2xl font-bold mt-1">--</h3>
                </div>
                <i class="fa-solid fa-video text-red-500 text-3xl"></i>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm">Total Revenue</p>
                    <h3 id="statRevenue" class="text-2xl font-bold mt-1">₹0</h3>
                </div>
                <i class="fa-solid fa-indian-rupee-sign text-green-500 text-3xl"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-200">Enrolled Courses</h2>
                    <button onclick="fetchCourses()" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 text-gray-300">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
                    </button>
                </div>
                
                <div id="courseList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <p class="text-gray-400 col-span-2 text-center py-10">Loading courses from Google Sheets...</p>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-fit">
                <h2 class="text-lg font-bold text-gray-200 mb-4"><i class="fa-solid fa-user-plus text-blue-500 mr-2"></i>New Student Register</h2>
                
                <form id="studentForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">FULL NAME</label>
                        <input type="text" id="stuName" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">EMAIL</label>
                        <input type="email" id="stuEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">MOBILE NO</label>
                        <input type="tel" id="stuMobile" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">PASSWORD / PIN</label>
                        <input type="password" id="stuPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200 text-sm">
                        Register Student
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        // *** APNA GOOGLE APPS SCRIPT WEB APP URL YAHAN REPLACE KAREIN ***
        const API_URL = "https://script.google.com/macros/s/AKfycbzmJCm8lFBGQbMGMyQuJ1hcOoLfjkP5Kc_wuKBGCuy3DRzYg7jdtyLX9H5iZflfgvb_Pg/exec";

        // Dashboard load hote hi data fetch karein
        window.addEventListener("DOMContentLoaded", () => {
            fetchStats();
            fetchCourses();
        });

        // 1. Fetch Dashboard Analytics
        async function fetchStats() {
            try {
                const response = await fetch(`${API_URL}?action=getDashboardStats`);
                const data = await response.json();
                
                document.getElementById("statStudents").innerText = data.totalStudents || 0;
                document.getElementById("statCourses").innerText = data.totalCourses || 0;
                document.getElementById("statLive").innerText = data.activeLiveClasses || 0;
                document.getElementById("statRevenue").innerText = `₹${data.totalRevenue || 0}`;
            } catch (err) {
                console.error("Stats loading failed:", err);
            }
        }

        // 2. Fetch & Render Courses
        async function fetchCourses() {
            const container = document.getElementById("courseList");
            container.innerHTML = `<p class="text-gray-400 col-span-2 text-center py-6">Fetching courses...</p>`;
            
            try {
                const response = await fetch(`${API_URL}?action=getCourses`);
                const courses = await response.json();
                
                if (courses.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 col-span-2 text-center py-6">No courses found in database.</p>`;
                    return;
                }

                container.innerHTML = courses.map(course => `
                    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                        <img src="${course.ThumbnailURL || 'https://via.placeholder.com/300x150?text=Course+Thumbnail'}" class="w-full h-36 object-cover">
                        <div class="p-4">
                            <span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded font-semibold">${course.Category || 'General'}</span>
                            <h3 class="font-bold text-md mt-2 text-gray-100">${course.Title}</h3>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${course.Description || ''}</p>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-700">
                                <span class="text-lg font-bold text-green-400">₹${course.Price}</span>
                                <a href="liveclass_course.html?courseId=${course.CourseID}" class="bg-blue-600 hover:bg-blue-700 text-xs text-white px-3.5 py-2 rounded-lg font-medium inline-block text-center">
                                View Classroom</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 col-span-2 text-center py-6">Error loading courses.</p>`;
            }
        }

        // 3. Register New Student (POST Request)
        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Processing...";
            btn.disabled = true;

            const payload = {
                action: "addStudent",
                payload: {
                    name: document.getElementById("stuName").value,
                    email: document.getElementById("stuEmail").value,
                    mobile: document.getElementById("stuMobile").value,
                    password: document.getElementById("stuPassword").value
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.status === "success") {
                    alert(`Student Registered Successfully! Assigned ID: ${result.studentId}`);
                    document.getElementById("studentForm").reset();
                    fetchStats(); // Update counters
                } else {
                    alert("Error: " + result.message);
                }
            } catch (err) {
                alert("Failed to submit data.");
            } finally {
                btn.innerText = "Register Student";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
